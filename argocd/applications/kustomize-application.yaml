apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grade-submission-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gururajbalasubramanian/argocd-kubernetes-gitops-tutorial-main.git
    targetRevision: HEAD
    paths:
     - path: kustomize/overlays/dev
     - path: kustomize/overlays/Prod 
  destination:
    server: https://kubernetes.default.svc
    namespace: grade-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true